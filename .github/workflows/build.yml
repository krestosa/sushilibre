name: Build and publish static distribution

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sushilibre-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        run: |
          npm run clean
          npm run build
          test -f dist/index.html
          test -f dist/app.css
          test -f dist/app.js

      - name: Run validation without blocking publish
        continue-on-error: true
        run: |
          npm run typecheck
          npm test

      - name: Upload static distribution artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sushilibre-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Publish static distribution to branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [[ "${remote_sha}" != "${SOURCE_SHA}" ]]; then
            echo "A newer source commit exists; skipping this stale publish."
            exit 0
          fi

          git add -A dist
          if git diff --cached --quiet; then
            echo "Static distribution is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish static distribution [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
