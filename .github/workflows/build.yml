name: Build, validate and publish

on:
  push:
    branches:
      - refactor/sass-typescript
    paths-ignore:
      - app.css
      - app.js
  pull_request:
    branches:
      - design/video-hero-sticky-countdown
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sushilibre-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Compile Sass and TypeScript
        run: npm run build

      - name: Verify menu contract
        run: npm test

      - name: Upload compiled site artifact
        uses: actions/upload-artifact@v4
        with:
          name: sushilibre-dist
          path: dist
          if-no-files-found: error

      - name: Publish compiled assets for GitHub Pages
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cp dist/app.css app.css
          cp dist/app.js app.js

          git add -f app.css app.js
          if git diff --cached --quiet; then
            echo "Compiled assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish compiled site assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
