name: Build and validate

on:
  push:
    branches:
      - refactor/sass-typescript
  pull_request:
    branches:
      - design/video-hero-sticky-countdown
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Compile Sass and TypeScript
        run: npm run build

      - name: Verify menu contract
        run: npm test

      - name: Upload compiled site
        uses: actions/upload-artifact@v4
        with:
          name: sushilibre-dist
          path: dist
          if-no-files-found: error
