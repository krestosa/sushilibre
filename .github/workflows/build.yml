name: Build, validate and publish

on:
  push:
    branches:
      - refactor/sass-typescript
    paths-ignore:
      - dist/**
  pull_request:
    branches:
      - design/video-hero-sticky-countdown
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sushilibre-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify static assets
        run: test -d dist/assets

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Clean generated files
        run: npm run clean

      - name: Compile static distribution
        run: npm run build

      - name: Verify menu and style contracts
        run: npm test

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build-diagnostics
          if-no-files-found: warn

      - name: Upload static distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: sushilibre-dist
          path: dist
          if-no-files-found: error

      - name: Publish static distribution
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add -A dist
          if git diff --cached --quiet; then
            echo "Static distribution is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish static distribution"
          git push origin "HEAD:${GITHUB_REF_NAME}"
