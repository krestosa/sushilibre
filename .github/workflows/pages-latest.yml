name: Build, archive and deploy latest branch to Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-latest
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-latest
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout current pushed branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        run: npm run clean && npm run build

      - name: Package downloadable static site
        id: package
        shell: bash
        run: |
          set -euo pipefail
          safe_ref="$(printf '%s' "$GITHUB_REF_NAME" | tr '/ ' '--')"
          short_sha="${GITHUB_SHA::7}"
          artifact_name="sushilibre-static-${safe_ref}-${short_sha}"
          archive="${artifact_name}.zip"

          python3 - "$archive" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          dist = Path('dist')

          if not dist.is_dir():
              raise SystemExit('dist/ does not exist after build')

          files = sorted(path for path in dist.rglob('*') if path.is_file())
          if not files:
              raise SystemExit('dist/ is empty after build')

          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as output:
              for path in files:
                  output.write(path, path.relative_to(dist))
          PY

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "Built artifact from commit $GITHUB_SHA"
          ls -lh "$archive"

      - name: Upload downloadable static ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
